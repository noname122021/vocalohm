<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Resistor Body -->
  <rect x="6" y="11" width="20" height="10" rx="4" fill="url(#bodyGrad)" stroke="#334155" stroke-width="0.5" />
  
  <!-- Glowing Bands -->
  <rect x="9" y="11" width="2.5" height="10" fill="#3b82f6" filter="url(#glow)" />
  <rect x="15" y="11" width="2.5" height="10" fill="#60a5fa" filter="url(#glow)" />
  <rect x="21" y="11" width="2.5" height="10" fill="#94a3b8" />
  
  <!-- Leads -->
  <path d="M1 16 H6 M26 16 H31" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  
  <!-- Sound Waves (Voice hint) -->
  <path d="M12 7 C14 5, 18 5, 20 7" stroke="#3b82f6" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  <path d="M10 4 C14 1, 18 1, 22 4" stroke="#3b82f6" stroke-width="1" stroke-linecap="round" opacity="0.4" />
</svg>